version: '3.8'

services:
  redis:
    image: redis:7-alpine
    restart: always
    command: redis-server --requirepass sua_senha_redis_aqui
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "incr", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  baileys-api:
    image: ghcr.io/fazer-ai/baileys-api:latest
    pull_policy: always
    restart: always
    depends_on:
      redis:
        condition: service_healthy
    volumes:
      - baileys_storage:/app/storage
    environment:
      - NODE_ENV=production
      - REDIS_URL=redis://redis:6379
      - REDIS_PASSWORD=
      - LOG_LEVEL=debug
      - BAILEYS_LOG_LEVEL=error
      - BAILEYS_PROVIDER_DEFAULT_API_KEY=125879
      - BAILEYS_PROVIDER_DEFAULT_CLIENT_NAME=Chatwoot
      - BAILEYS_PROVIDER_DEFAULT_URL=http://localhost:3025
    ports:
      - "3025:3025"
    command:
      - sh
      - -c
      - bun manage-api-keys create user 125879 && bun start
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3025/status || exit 1"]
      interval: 20s
      timeout: 20s
      retries: 10

volumes:
  redis_data:
  baileys_storage: